<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — HabitFlow</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#E8631A"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="HabitFlow"/>
  <meta name="mobile-web-app-capable" content="yes"/>
</head>
<body class="auth-body">

  <div class="auth-split">

    <!-- Left panel: branding -->
    <div class="auth-left">
      <a href="index.html" class="logo">Habit<span>Flow</span></a>
      <div class="auth-left-content">
        <h2>Welcome back.</h2>
        <p>Your habits are waiting for you. Keep the streak alive.</p>
        <div class="auth-quote">
          <blockquote>"We are what we repeatedly do. Excellence, then, is not an act, but a habit."</blockquote>
          <cite>— Aristotle</cite>
        </div>
      </div>
      <div class="auth-left-decor"></div>
    </div>

    <!-- Right panel: form -->
    <div class="auth-right">
      <div class="auth-card">
        <h1 class="auth-title">Log in</h1>
        <p class="auth-sub">Don't have an account? <a href="signup.html">Sign up free</a></p>

        <div id="auth-error" class="auth-error hidden"></div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
            <button class="toggle-pw" onclick="togglePassword('password', this)" type="button">👁</button>
          </div>
        </div>

        <button id="login-btn" class="btn-primary btn-full" onclick="handleLogin()">
          <span>Log in</span>
        </button>

        <div class="divider"><span>or</span></div>

        <button class="btn-google btn-full" onclick="handleGoogleLogin()">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 19 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-4.9l-6.2-5.2C29.4 35.6 26.8 36.5 24 36.5c-5.2 0-9.5-3.4-11.1-8H6.6C10 39.1 16.5 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2c3.6-3.4 5.6-8.4 5.6-14.8 0-1.3-.1-2.7-.1-4z"/></svg>
          Continue with Google
        </button>

        <p class="auth-footer-note">
          <a href="#">Forgot your password?</a>
        </p>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('SW registered'))
          .catch(e => console.log('SW failed:', e));
      });
    }
  </script>
</body>
</html>
